<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl">
<body>
<div id="archive-ui" hx-target:inherited="this" hx-swap:inherited="outerHTML">
    <th:block th:if="${status.name() == 'RUNNING'}"> <!--.-->
        <div hx:get="@{/contacts/archives/{id}(id=${archiveId})}" hx-trigger="load delay:500ms"> <!--.-->
            <div class="progress-container">
                <div class="progress-bar"
                     role="progressbar"
                     aria-label="Archive progress"
                     th:aria-valuenow="${progress}"
                     th:style="|width:${progress}%|"></div> <!--.-->
            </div>
        </div>
    </th:block>
    <!-- tag::complete[] -->
    <th:block th:if="${status.name() == 'COMPLETE'}">
        <p class="muted archive-ready">The archive is ready.</p>
        <sl:button as="a" variant="outline"
                   th:href="@{/contacts/archives/{id}(id=${archiveId})}"> <!--.-->
            <sl:icon name="download"/>
            Download
        </sl:button>
    </th:block>
    <!-- end::complete[] -->
    <th:block th:if="${status.name() == 'FAILED'}"> <!--.-->
        <div>Failed!</div>
    </th:block>
</div>
</body>
</html>
