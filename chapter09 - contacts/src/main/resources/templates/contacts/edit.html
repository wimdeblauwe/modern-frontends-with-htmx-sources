<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div>
            <h1>
                <span th:if="${editMode.name() == 'CREATE'}">New contact</span>
                <span th:if="${editMode.name() == 'UPDATE'}">Update contact</span>
            </h1>
            <p class="muted">
                <span th:if="${editMode.name() == 'CREATE'}">Add a new contact to your list of contacts.</span>
                <span th:if="${editMode.name() == 'UPDATE'}">Update a contact from your list of contacts.</span>
            </p>
        </div>
    </div>
    <!-- tag::form[] -->
    <form th:action="${editMode?.name() == 'UPDATE'}?@{/contacts/{id}/edit(id=${formData.id})}:@{/contacts/new}"
          th:object="${formData}"
          th:method="post">
        <sl:field-group>
            <sl:field th:field="*{givenName}">
                <sl:field-label>Given Name</sl:field-label>
                <sl:input/>
                <sl:field-error/>
            </sl:field>
            <sl:field th:field="*{familyName}">
                <sl:field-label>Family Name</sl:field-label>
                <sl:input/>
                <sl:field-error/>
            </sl:field>
            <sl:field th:field="*{phone}">
                <sl:field-label>Phone</sl:field-label>
                <sl:input type="tel"/>
                <sl:field-error/>
            </sl:field>
            <!-- tag::email[] -->
            <sl:field th:field="*{email}"
                      id="email-form-element"
                      th:x-data="|{ invalid: ${#fields.hasErrors('email')} }|"
                      x-on:htmx:after:settle="invalid = $el.querySelector('.field-error') !== null"
                      x-bind:data-invalid="invalid"> <!--.-->
                <sl:field-label>Email</sl:field-label>
                <sl:input type="email"
                          hx-trigger="keyup changed delay:200ms"
                          hx:post="${editMode.name() == 'CREATE'} ? @{/contacts/validate}"
                          hx-select="#email-error-container"
                          hx-target="#email-error-container"
                          hx-swap="outerHTML"
                          x-bind:aria-invalid="invalid"/> <!--.-->
                <div id="email-error-container"> <!--.-->
                    <sl:field-error/>
                </div>
            </sl:field>
            <!-- end::email[] -->
            <div>
                <sl:button type="submit">Save</sl:button>
            </div>
        </sl:field-group>
    </form>
    <!-- end::form[] -->
    <!-- tag::delete[] -->
    <div th:if="${editMode?.name() == 'UPDATE'}" class="actions edit-actions">
        <sl:button variant="destructive"
                   commandfor="delete-contact-dialog"
                   command="show-modal">Delete Contact</sl:button> <!--.-->
        <sl:button as="a" variant="outline" th:href="@{/contacts}">Back</sl:button>
        <sl:alert-dialog id="delete-contact-dialog"> <!--.-->
            <sl:alert-dialog-header>
                <sl:alert-dialog-title>Delete contact?</sl:alert-dialog-title>
                <sl:alert-dialog-description
                        th:text="|Are you sure you want to delete the contact ${formData.givenName} ${formData.familyName}?|">
                </sl:alert-dialog-description>
            </sl:alert-dialog-header>
            <sl:alert-dialog-footer>
                <sl:alert-dialog-cancel/> <!--.-->
                <sl:button variant="destructive"
                           id="delete-button"
                           hx:delete="@{/contacts/{id}(id=${formData.id})}"
                           hx-target="body"
                           hx-push-url="true">Delete</sl:button> <!--.-->
            </sl:alert-dialog-footer>
        </sl:alert-dialog>
    </div>
    <!-- end::delete[] -->
</div>
</body>
</html>
