<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div>
            <h1>Contacts</h1>
            <p class="muted">A list of all your contacts.</p>
        </div>
        <!-- tag::add-contact[] -->
        <sl:button as="a" th:href="@{/contacts/new}">Add contact</sl:button>
        <!-- end::add-contact[] -->
    </div>
    <!-- tag::search[] -->
    <form th:action="@{/contacts}"
          th:method="get"
          class="search">
        <sl:label for="search">Search</sl:label>
        <sl:input type="search" name="q" id="search"
                  th:value="${query}"
                  hx:get="@{/contacts}"
                  hx-trigger="search, keyup delay:200ms changed"
                  hx-target="tbody"
                  hx-swap="outerHTML"
                  hx-push-url="true"
                  hx-indicator="#spinner"/> <!--.-->
        <sl:button type="submit" variant="outline">Search</sl:button>
        <sl:spinner id="spinner" class="htmx-indicator"/> <!--.-->
    </form>
    <!-- end::search[] -->
    <!-- tag::archive[] -->
    <div id="archive-ui" hx-target:inherited="this" hx-swap:inherited="outerHTML"> <!--.-->
        <sl:button variant="outline"
                   hx:post="@{/contacts/archives}">Download archive</sl:button> <!--.-->
    </div>
    <!-- end::archive[] -->
    <sl:table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th><span class="visually-hidden">Edit or View</span></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="contact : ${contacts}">
            <td th:text="|${contact.givenName} ${contact.familyName}|"></td>
            <td th:text="${contact.phone}"></td>
            <td th:text="${contact.email}"></td>
            <!-- tag::buttons[] -->
            <!-- tag::rowactions[] -->
            <td data-align="end">
                <sl:button as="a" variant="link" size="sm"
                           th:href="@{/contacts/{id}/edit(id=${contact.id.value()})}">Edit</sl:button>
                <sl:button as="a" variant="link" size="sm"
                           th:href="@{/contacts/{id}(id=${contact.id.value()})}">View</sl:button>
                <sl:button variant="link" size="sm"
                           hx:delete="@{/contacts/{id}(id=${contact.id.value()})}"
                           hx:confirm="|Are you sure you want to delete the contact ${contact.givenName} ${contact.familyName}?|"
                           hx-swap="outerHTML swap:1s"
                           hx-target="closest tr">Delete</sl:button> <!--.-->
            </td>
            <!-- end::rowactions[] -->
            <!-- end::buttons[] -->
        </tr>
        <!-- tag::clicktoload[] -->
        <tr th:if="${(page + 1) * size < totalElements}">
            <td colspan="4">
                <span hx:get="@{/contacts(page=${page + 1},q=${query})}"
                      hx-trigger="revealed"
                      hx-select="tbody > tr"
                      hx-target="closest tr"
                      hx-swap="outerHTML"></span> <!--.-->
            </td>
        </tr>
        <!-- end::clicktoload[] -->
        </tbody>
    </sl:table>
</div>
</body>
</html>
