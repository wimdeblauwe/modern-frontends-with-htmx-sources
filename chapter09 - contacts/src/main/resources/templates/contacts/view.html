<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>
<div layout:fragment="content">
    <sl:card> <!--.-->
        <sl:card-header>
            <sl:card-title level="1"
                           th:text="|${contact.givenName} ${contact.familyName}|"></sl:card-title> <!--.-->
        </sl:card-header>
        <sl:card-content>
            <dl class="contact-details">
                <dt>Phone</dt>
                <dd th:text="${contact.phone}"></dd>
                <dt>Email</dt>
                <dd th:text="${contact.email}"></dd>
            </dl>
        </sl:card-content>
        <sl:card-footer class="actions">
            <sl:button as="a"
                       th:href="@{/contacts/{id}/edit(id=${contact.id.value()})}">Edit</sl:button>
            <sl:button as="a" variant="outline"
                       th:href="@{/contacts}">Back</sl:button> <!--.-->
        </sl:card-footer>
    </sl:card>
</div>
</body>
</html>
