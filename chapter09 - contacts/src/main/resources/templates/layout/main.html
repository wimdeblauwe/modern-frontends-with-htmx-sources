<!DOCTYPE html>
<html th:lang="|${#locale.language}-${#locale.country}|"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacts App</title>
    <th:block th:replace="~{sl/layout :: theme-script}"></th:block>
    <script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script> <!--.-->
    <script defer th:src="@{/webjars/htmx.org/dist/ext/hx-alpine-compat.min.js}"></script>
    <th:block th:replace="~{sl/layout :: assets}"></th:block> <!--.-->
    <vite:client></vite:client>
    <vite:vite>
        <vite:entry value="/css/application.css"></vite:entry>
    </vite:vite>
</head>
<body>
<!-- tag::container[] -->
<div class="container">
    <header class="app-header">
        <sl:theme-toggle></sl:theme-toggle>
    </header>
    <sl:alert th:if="${successMessage}" class="flash-message"> <!--.-->
        <sl:icon name="circle-check"/>
        <sl:alert-title th:text="${successMessage}">Contact deleted</sl:alert-title>
    </sl:alert>
    <main layout:fragment="content">
    </main>
</div>
<!-- end::container[] -->

<th:block layout:fragment="script-content">

</th:block>
</body>
</html>
