<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>
<div layout:fragment="content" class="container">
    <h1>Release notes viewer</h1>
    <div class="release-notes-viewer">
        <div>
            <!-- tag::tree[] -->
            <wa-tree id="repositories-tree"
                     selection="leaf">
                <wa-tree-item lazy
                              hx-trigger="wa-lazy-load"
                              hx:get="@{/repositories}"
                              hx-swap="innerHTML"
                              hx-on::after:swap="this.lazy = false"> <!--.-->
                    GitHub Repositories
                </wa-tree-item>
            </wa-tree>
            <!-- end::tree[] -->
        </div>
        <!-- tag::release-notes-container[] -->
        <div>
            <div id="release-notes-container">
                <div>Select a version on the left to view the release notes.</div>
            </div>
            <div id="release-notes-loading-indicator">
                <wa-spinner class="htmx-indicator"></wa-spinner>
            </div>
        </div>
        <!-- end::release-notes-container[] -->
    </div>
</div>
<th:block layout:fragment="script-content">
    <!-- Add additional scripts there that are only needed for this page (Application wide scripts should be added in layout/main.html) -->
</th:block>
</body>
</html>
