<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>
<div layout:fragment="content">
    <div hx-ws:connect="/chatroom"
         hx-target="#messages"
         hx-swap="beforeend"
         class="flex flex-col h-screen"
         hx-on::ws:after:message:outgoing="clearInput()">
        <div id="messages" class="grow">
            <div class="chat chat-start">
                <div class="chat-bubble">Welcome to the chat!</div>
            </div>
        </div>
        <div class="flex mb-4">
            <form id="form" hx-ws:send class="flex gap-2 mx-2 w-full">
                <input id="chat-message-input"
                       name="chatMessage"
                       type="text"
                       class="input w-full"
                       placeholder="Write a message"
                       autofocus>
                <button class="btn btn-neutral">Chat</button>
            </form>
        </div>
    </div>
</div>
<!-- tag::templates[] -->
<template> <!--.-->
    <div class="chat chat-start" th:fragment="incoming-message(message)"> <!--.-->
        <div class="chat-bubble" th:text="${message}"></div>
    </div>
</template>
<template>
    <div class="chat chat-end" th:fragment="user-message(message)"> <!--.-->
        <div class="chat-bubble" th:text="${message}"></div>
    </div>
</template>
<!-- end::templates[] -->
<th:block layout:fragment="script-content">
    <script>
        function clearInput() {
            let element = document.getElementById('chat-message-input');
            element.value = '';
            element.focus();
        }
    </script>
</th:block>
</body>
</html>
